# @package _global_

defaults:
  - override /env: tree/regression_tree
  - override /gflownet: trajectorybalance
  - override /loss: trajectorybalance
  - override /proxy: regression_tree
  - override /logger: wandb
  - override /evaluator: tree

device: cpu

# Environment
env:
  max_depth: 5
  scale_y: True # Standardize targets (train-split stats); RMSE still reported in original units
  rescale_thresholds: True # If True, trivially unnecessary splits are not considered during training
  data_path: null
  node_kwargs:
    features: # If feature names and a dataset are provided, the provided feature names will overwrite the dataset ones
    cube_kwargs:
      n_comp: 3
      beta_params_min: 1.0
      beta_params_max: 100.0
      min_incr: 0.99 # original value was 0.1, but setting to 0.99 works better and faster (forces cube env to sample threshold in one step)
      fixed_distr_params:
        beta_weights: 1.0
        beta_alpha: 10.0
        beta_beta: 10.0
        bernoulli_eos_prob: 0.1
        bernoulli_bts_prob: 0.1
      random_distr_params:
        beta_weights: 1.0
        beta_alpha: 1.0 # to be uniform over [0, 1] for random sampling, old value was 10.0
        beta_beta: 1.0 # to be uniform over [0, 1] for random sampling, old value was 10.0
        bernoulli_eos_prob: 0.1
        bernoulli_bts_prob: 0.1

# Proxy
proxy:
  # --- Structure prior over trees ---
  # One of: "node_count", "exponential", "bcart", "none"
  prior_type: node_count
  # Penalty coefficient for prior_type="exponential": log_prior = -beta * n_internal
  beta: 1.0
  # BCART prior (prior_type="bcart"): p_split(depth) = sigma * (1 + depth)^(-phi)
  sigma: 0.95
  phi: 2.0

  # --- Normal-Inverse-Gamma prior over leaf parameters (mu, sigma^2) ---
  # null values are resolved from the training targets at setup:
  # mu_0 -> mean(y_train); beta_0 -> (alpha_0 - 1) * var(y_train)
  # beta_0 also accepts "overfit": (alpha_0 - 1) * residual variance of an
  # overfit greedy CART, i.e. the variance prior is centered near the post-fit
  # noise level as recommended by Chipman et al. (1998, Sec. 4.1).
  mu_0: null
  kappa_0: 0.1
  alpha_0: 2.0
  beta_0: null

  # If True, divide the marginal log-likelihood by N_train so the proxy reports
  # the average per-sample log-likelihood. This rescales the likelihood term (a
  # 1/N temperature on it), so it must remain False to sample from the true
  # posterior. The structure log-prior is left unscaled.
  normalize_likelihood: False

  # --- Reward function (proxy value -> reward) ---
  # Log-posterior is passed through an exponential: reward = alpha * exp(beta * proxy)
  # beta acts as a temperature: p(T) ∝ posterior^beta. It must be 1.0 to sample
  # from the true (untempered) Bayesian posterior. Even with standardized
  # targets (env.scale_y) the regression log-posterior magnitude is roughly
  # 1.4 * N_train nats, far outside the float32 exp range (~[-87, 88]); this is
  # handled by buffer.store_log_rewards=True below, which keeps the loss and
  # the replay buffer entirely in log space. Linear rewards are derived only
  # for reporting, where under/overflow to 0/inf is harmless.
  reward_function: exponential
  reward_function_kwargs:
    beta: 1.0
    alpha: 1.0
  reward_min: 0.0
  do_clip_rewards: False

# Buffer
buffer:
  replay_capacity: 100
  # With beta=1.0 the (linear) rewards are exp(log-posterior), which under- or
  # overflows for all bundled regression datasets. Storing log-rewards keeps
  # the replay buffer insertion criterion and weighted sampling numerically
  # valid.
  store_log_rewards: True
  # Replay-buffer duplicate check. With check_diversity: False (the old
  # default), insertion only requires reward > min(buffer), so the best tree
  # keeps re-inserting itself until the buffer holds ~100 copies of ONE state
  # (observed on all 2026-08 tree campaigns; the legacy dt-gfn buffer always
  # rejected duplicate states). True compares each candidate to buffer entries
  # with env.isclose and skips duplicates. Set False only to reproduce
  # pre-2026-08 campaigns.
  check_diversity: True
  # Which entries the duplicate check compares against: -1 = the FULL buffer
  # (recommended). A positive x only checks entries whose reward is within
  # x * (buffer reward range) of the candidate -- this silently disables the
  # check once the buffer collapses to a single reward (range = 0).
  diversity_check_reward_similarity: -1
  train: null
  test: null

# GFlowNet hyperparameters
gflownet:
  random_action_prob: 0.1
  # Epsilon-greedy annealing: when enabled, the random-action probability
  # decays from random_action_prob (epsilon_0) to epsilon_min over anneal_steps
  # iterations (null -> n_train_steps), then stays at epsilon_min. Disabled by
  # default, i.e. epsilon is fixed at random_action_prob for the whole run.
  epsilon_annealing:
    enabled: False
    epsilon_min: 0.01
    anneal_steps: null
    schedule: linear
  optimizer:
    batch_size:
      forward: 45
      backward_replay: 5
      backward_dataset: 0
    lr: 0.001
    z_dim: 16
    lr_z_mult: 100
    n_train_steps: 50000
    lr_decay_period: 100000
    lr_decay_gamma: 0.5
  replay_sampling: weighted
  train_sampling: permutation

# Policy
policy:
  forward:
    type: mlp
    n_hid: 256
    n_layers: 3
  backward:
    type: mlp
    n_hid: 256
    n_layers: 3
    shared_weights: False

# Evaluator
evaluator:
  first_it: True
  period: 100
  checkpoints_period: 500
  n_trajs_logprobs: 10
  logprobs_batch_size: 10
  n: 10
  n_top_k: 5000
  top_k: 100
  top_k_period: -1
  # Tree-specific evaluation (see gflownet/evaluator/tree.py). For the
  # RegressionTree env, RMSE / R2 metrics are reported (alpha_value is unused).
  tree_test:
    n_samples: 1000
    top_k_trees: 10
    plot_top_k: True
    seed: null

# WandB
logger:
  lightweight: True
  run_name: null
  project_name: "dt-gfn_regression"
  entity: alex-hg
  tags:
    - gflownet
    - tree
    - regression
  do:
    online: True

# Hydra
hydra:
  run:
    dir: ${user.logdir.root}/regression_tree/${oc.env:SLURM_JOB_ID,local}/${now:%Y-%m-%d_%H-%M-%S_%f}

# Profiling
profile: false
profile_sort: cumtime
profile_n_rows: 20
# Optional regex to restrict the printed stats to matching function paths,
# e.g. "gflownet" to only show functions from this package. The dumped
# train.prof always contains the full, unfiltered stats.
profile_filter: null

# torch.profiler alternative (torch_profile=true): op-level view that sees
# inside autograd's backward, which cProfile reports as one opaque call.
# Records iterations [wait+2, wait+2+active); see train_with_torch_profiler.
torch_profile: false
torch_profile_wait: 10
torch_profile_active: 5
# Recording per-op input shapes multiplies profiler memory; needs generous
# --mem and a short active window.
torch_profile_shapes: false
