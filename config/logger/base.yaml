_target_: gflownet.utils.logger.Logger

do:
  online: False
  times: False

project_name: "GFlowNet"

# Log dir
logdir:
  root: ./logs
  ckpts: ckpts
  # Number of most recent intermediate checkpoints (iter_<step>.ckpt) to keep.
  # Older ones are deleted every time a new checkpoint is written. Set to null to
  # keep all of them. The final checkpoint (final.ckpt) is always kept.
  keep_n_ckpts: 3
  # Iterations whose checkpoint is kept regardless of keep_n_ckpts, if it exists.
  keep_ckpts_at: [100, 500, 1000]
  overwrite: True
debug: False
lightweight: False
progressbar:
  skip: False
  n_iters_mean: 100
context: "0"
notes: null # wandb run notes (e.g. "baseline")
entity: null # wandb entity (e.g. "gflownet", "hernanga", "mila-ocp" etc.)
run_id: null # Unique identifier of a wandb run

# Set to True for resuming runs
is_resumed: False

# Name of the run
run_name: null
# Whether the date (and time) should be included in the run name
run_name_date: True
# Whether the job id should be included in the run name
run_name_job: True
