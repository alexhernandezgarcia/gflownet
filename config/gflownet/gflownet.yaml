_target_: gflownet.gflownet.GFlowNetAgent
# Random seeds
seed: 0
# Optimizer
optimizer:
  # Learning rates
  lr: 0.0001
  lr_decay_period: 1000000
  lr_decay_gamma: 0.5
  method: adam
  # Optimizer: adam, sgd
  adam_beta1: 0.9
  adam_beta2: 0.999
  # Momentum for SGD
  sgd_momentum: 0.9
  # Number of trajectories of each kind
  batch_size:
    # Forward on-policy (possibly tempered and/or with random actions)
    forward: 10
    # Backward from training set
    backward_dataset: 0
    # Backward from replay buffer
    backward_replay: 0
  # Train to sample ratio
  train_to_sample_ratio: 1
  # Number of training iterations
  n_train_steps: 5000
  # From original implementation
  bootstrap_tau: 0.0
  clip_grad_norm: 0.0
# State flow modelling
state_flow: null
# Force zero probability of sampling invalid actions
mask_invalid_actions: True
# Temperature for the logits /= temperature_logits
temperature_logits: 1.0
# Percentage of random actions
random_action_prob: 0.0
# Epsilon-greedy annealing of random_action_prob during training. If enabled,
# the probability of sampling a random action decays from random_action_prob
# (epsilon_0, at iteration 1) down to epsilon_min (reached at iteration
# anneal_steps, then held constant). Disabled by default: epsilon stays fixed
# at random_action_prob throughout training, as before.
epsilon_annealing:
  enabled: False
  # Final (small, positive) epsilon; must be <= random_action_prob
  epsilon_min: 0.01
  # Iterations over which to decay epsilon; null -> optimizer.n_train_steps
  anneal_steps: null
  # Decay shape: linear | exponential
  schedule: linear
# Replay buffer
replay_sampling: permutation
# Train data set backward sampling
train_sampling: permutation
use_context: False
garbage_collection_period: 0
collect_reversed_logprobs: False
